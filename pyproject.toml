[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-knowledge-system"
version = "0.1.0"
description = "Shared engineering memory for Claude Code and Codex with isolated Microsoft storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "msal>=1.31,<2",
  "msal-extensions>=1.2,<2", "filelock>=3.16,<4",
  "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "google-auth>=2.38,<3", "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pytest-cov>=6,<8"]

[project.scripts]
ekm = "ekm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ekm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in live Microsoft tests requiring an isolated test account"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
